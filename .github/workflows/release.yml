name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 設定 Android SDK
        uses: android-actions/setup-android@v3

      - name: 快取 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 賦予 Gradlew 執行權限
        run: chmod +x ./gradlew

      - name: 建置 Release APK
        run: ./gradlew assembleRelease

      - name: 簽署 APK (Debug 簽名)
        run: |
          # 使用 debug keystore 進行簽署（如需正式簽名請設定 secrets）
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          ${BUILD_TOOLS}zipalign -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk || true
          ${BUILD_TOOLS}apksigner sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/SubtitleOverlay-${{ github.ref_name }}.apk \
            app/build/outputs/apk/release/app-release-aligned.apk || \
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/SubtitleOverlay-${{ github.ref_name }}.apk

      - name: 同時建置 Debug APK
        run: ./gradlew assembleDebug

      - name: 取得變更紀錄
        id: changelog
        run: |
          echo "## 變更內容" > changelog.md
          echo "" >> changelog.md
          git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD --pretty=format:"- %s" >> changelog.md 2>/dev/null || echo "- 初始版本" >> changelog.md

      - name: 建立 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.md
          files: |
            app/build/outputs/apk/release/SubtitleOverlay-${{ github.ref_name }}.apk
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
