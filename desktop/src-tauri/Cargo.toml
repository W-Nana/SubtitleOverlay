[package]
name = "subtitle-overlay-desktop"
version = "0.1.0"
description = "Cross-platform desktop subtitle overlay"
authors = ["SubtitleOverlay Contributors"]
edition = "2021"

[lib]
name = "subtitle_overlay_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
fontdb = "0.23"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = ["macos-private-api"] }
tokio = { version = "1", features = ["time"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
pangocairo = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
